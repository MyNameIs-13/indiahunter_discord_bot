services:
  indiahunter-discord-bot:
    build: .
    image: indiahunter-discord-bot:${TAG}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 50M
      replicas: 1
    logging:
      driver: json-file
      options:
        max-size: '5m'
        max-file: '5'
    labels:
      - 'com.centurylinklabs.watchtower.enable=false'  #  watchtower should not try to monitor and update
    container_name: indiahunter-discord-bot
    environment:
      - CHANNEL_ID=${CHANNEL_ID}
      - SERVER_ID=${SERVER_ID}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    env_file:
      - .secrets
    ports:
      - '8648:8080'  # Optional: expose healthcheck port for external visibility
    restart: always
    healthcheck:
      test: [ 'CMD', 'python3', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8080/health")' ]
      interval: 5m
      timeout: 5s
      retries: 3
    cap_drop:
      - ALL
    volumes:
      - '${LOG_PATH:-/}:/app/logs'
      - '${DATA_PATH:-/}:/app/data'
      - /etc/localtime:/etc/localtime:ro  # Share host timezone setting
    user: ${UID:-65534}:${GID:-65534}
